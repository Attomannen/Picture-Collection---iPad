name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Unit tests (core + .pur format)
        shell: bash
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPad" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "Simulator: $UDID"
          xcodebuild test \
            -scheme PicBoard-Package \
            -destination "id=$UDID" \
            -only-testing:CoreTests \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 120

      - name: Build iPad app
        shell: bash
        run: |
          xcodebuild build \
            -scheme PicBoard \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 80
